networks:
  cloud-net:
    name: cloud-net
    driver: bridge

services:
  # 1. Web Frontend Server
  web-frontend-server:
    build: ./web-frontend-server
    image: myminicloud/web:v1
    container_name: web-frontend-server
    networks:
      - cloud-net
    ports:
      - "8080:80"
    volumes:
      - ./web-frontend-server/conf.default:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  web-frontend-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: web-frontend-exporter
    command:
      - --nginx.scrape-uri=http://web-frontend-server/nginx_status
    networks:
      - cloud-net
    depends_on:
      - web-frontend-server
    restart: unless-stopped

  # 2. Application Backend Server
  application-backend-server:
    build: ./application-backend-server
    image: myminicloud/app:v1
    container_name: application-backend-server
    networks:
      - cloud-net
    ports:
      - "8085:8081"
    environment:
      OIDC_REALM: realm_sv523h0171_sv523h0010
      OIDC_INTERNAL_URL: http://authentication-identity-server:8080
      OIDC_ISSUER: http://localhost:8081/realms/realm_sv523h0171_sv523h0010
      OIDC_AUDIENCE: account
    restart: unless-stopped

  # 3. Relational Database Server (MariaDB)
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    networks:
      - cloud-net
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - ./relational-database-server/data:/var/lib/mysql
    restart: unless-stopped

  # 4. Authentication & Identity Server (Keycloak)
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    networks:
      - cloud-net
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./authentication-identity-server/data:/opt/keycloak/data
    restart: unless-stopped

  # 5. Object Storage Server (MinIO)
  object-storage-server:
    image: cgr.dev/chainguard/minio:latest
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - cloud-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    restart: unless-stopped

  # 6. Internal DNS Server (Bind9)
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    networks:
      - cloud-net
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    restart: unless-stopped

  # 7. Monitoring Node Exporter
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    networks:
      - cloud-net
    ports:
      - "9100:9100"
    volumes:
      - ./monitoring-grafana-dashboard-server/data:/var/lib/grafana
    restart: unless-stopped

  # 8. Monitoring Prometheus
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    networks:
      - cloud-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # 9. Logging & Visualization (Grafana)
  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    networks:
      - cloud-net
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring-grafana-dashboard-server/data:/var/lib/grafana
    restart: unless-stopped

  # 10. API Gateway / Reverse Proxy (Nginx)
  api-gateway-proxy-server:
    image: nginx:stable-alpine
    container_name: api-gateway-proxy-server
    networks:
      - cloud-net
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-frontend-server
      - application-backend-server
      - authentication-identity-server
    restart: unless-stopped

  web-frontend-server-2:
    build: ./web-frontend-server-2
    image: myminicloud/web2:v1
    container_name: web-frontend-server-2
    networks:
      - cloud-net
    ports:
      - "8082:80"
    restart: unless-stopped